<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jack Dalby - Portfolio</title>
    <link href="style.css" rel="stylesheet" type="text/css">
  </head>
  <body>
    <header>
      <div>
        <h1>Portfolio Website</h1>
        <p class="subtitle">By Jack Dalby</p>

      <section class="projects">
        <h2>Featured Projects</h2>
        <div class="project-grid">
          <a href="Tinting.html" class="project-card">
            <div class="project-image">
              <img src="images/tinting/tint_dragonfly.png" alt="Tinting">

              <h3>Tinting</h3>

          <a href="Colour-inversion.html" class="project-card">

            <div class="project-info">
              <h3>Colour Inversion</h3>
            </div>
          </a>

          <a href="Brightness-Changing.html" class="project-card">
            <div class="project-image">
              <img src="images/brightness/bright_cat.png" alt="Brightness changing">
            </div>
            <div class="project-info">
              <h3>Brightness Changing</h3>
